# Job Notifier Application Configuration Template
# Copy this file to application.properties and fill in your values

spring.application.name=job-notifier

# =================================================================
# DATABASE CONFIGURATION
# =================================================================
# MySQL Database connection settings
spring.datasource.url=jdbc:mysql://localhost:3306/job_notifier_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=your_password_here
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =================================================================
# JWT AUTHENTICATION CONFIGURATION
# =================================================================
# JWT Secret Key - MUST BE CHANGED IN PRODUCTION
# Generate using: openssl rand -base64 64
jwt.secret=CHANGE_THIS_TO_A_SECURE_RANDOM_STRING_AT_LEAST_64_CHARACTERS_LONG
# Token expiration time in milliseconds (default: 24 hours)
jwt.expiration=86400000

# =================================================================
# SCHEDULER CONFIGURATION
# =================================================================
# How often the scheduler runs (in milliseconds)
# 3600000 = 1 hour, 1800000 = 30 minutes, 900000 = 15 minutes
scheduler.fixed-rate=3600000
# Maximum number of times the scheduler will run
scheduler.max-runs=10
# Enable or disable the scheduler
scheduler.enabled=true

# =================================================================
# AI CONFIGURATION (Google Gemini)
# =================================================================
# Get your API key from: https://aistudio.google.com/app/apikey
gemini.api.key=your-gemini-api-key-here
# Model to use: gemini-1.5-flash (fast/cheap), gemini-1.5-pro (more powerful)
gemini.model=gemini-1.5-flash
# Minimum relevance score (0.0 to 1.0) for a job to be considered relevant
ai.relevance.threshold=0.7

# AI Prompt Template - customize to adjust matching behavior and data extraction
# Available placeholders: {job}, {city}, {salary}, {companies}, {experience}, {noticePeriod}, {college}
# The AI will extract structured data from random job formats AND provide relevance scoring
ai.prompt.template=Analyze the following job posting and user preferences. Extract structured information and score the relevance from 0 to 1.\n\nJob Posting (may be in any format - text, structured, or mixed):\n{job}\n\nUser Preferences:\nCity: {city}\nSalary: {salary}\nCompanies: {companies}\nExperience: {experience}\nNotice Period: {noticePeriod}\nCollege: {college}\n\nTasks:\n1. Extract and structure the job information\n2. Analyze how well this job matches the user preferences\n3. Provide a relevance score from 0 to 1\n\nProvide ONLY a JSON response with these keys:\n- 'score': number between 0 and 1 (relevance score)\n- 'reason': string (explanation of the score)\n- 'company': string (company name)\n- 'experience': string (required experience)\n- 'location': string (job location/city)\n- 'salary': string (salary range or amount)\n- 'description': string (clean, concise job description summary)

# =================================================================
# CLOUDINARY CONFIGURATION (Cloud Storage)
# =================================================================
# Sign up for free at: https://cloudinary.com/users/register/free
cloudinary.cloud-name=your-cloud-name
cloudinary.api-key=your-api-key
cloudinary.api-secret=your-api-secret

# =================================================================
# LATEX COMPILER CONFIGURATION
# =================================================================
# Online LaTeX compiler service URL (using LaTeX.Online API by YtoTech)
# Note: The actual endpoint is hardcoded in LatexCompilerService
latex.compiler.url=https://latex.ytotech.com/builds/sync
# Compilation timeout in milliseconds
latex.timeout=30000

# =================================================================
# SERVER CONFIGURATION
# =================================================================
server.port=8080

# =================================================================
# LOGGING CONFIGURATION
# =================================================================
# Set to DEBUG for development, INFO for production
logging.level.com.jobnotifer=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# =================================================================
# NOTES
# =================================================================
# 1. Never commit application.properties with real credentials to git
# 2. Use environment variables in production:
#    - SPRING_DATASOURCE_USERNAME
#    - SPRING_DATASOURCE_PASSWORD
#    - JWT_SECRET
#    - GEMINI_API_KEY
#    - CLOUDINARY_CLOUD_NAME
#    - CLOUDINARY_API_KEY
#    - CLOUDINARY_API_SECRET
#
# 3. Example environment variable usage:
#    export SPRING_DATASOURCE_PASSWORD=mypassword
#    ./mvnw spring-boot:run
#
# 4. For production deployment, consider:
#    - Using a secrets manager (AWS Secrets Manager, Azure Key Vault, etc.)
#    - Enabling HTTPS
#    - Adjusting CORS settings
#    - Setting up database connection pooling
#    - Configuring proper logging

