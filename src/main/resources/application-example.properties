# Job Notifier Application Configuration Template
# Copy this file to application.properties and fill in your values

spring.application.name=job-notifier

# =================================================================
# DATABASE CONFIGURATION
# =================================================================
# MySQL Database connection settings
spring.datasource.url=jdbc:mysql://localhost:3306/job_notifier_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=your_password_here
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =================================================================
# JWT AUTHENTICATION CONFIGURATION
# =================================================================
# JWT Secret Key - MUST BE CHANGED IN PRODUCTION
# Generate using: openssl rand -base64 64
jwt.secret=CHANGE_THIS_TO_A_SECURE_RANDOM_STRING_AT_LEAST_64_CHARACTERS_LONG
# Token expiration time in milliseconds (default: 24 hours)
jwt.expiration=86400000

# =================================================================
# SCHEDULER CONFIGURATION
# =================================================================
# Job Processing Scheduler - How often the scheduler runs (in milliseconds)
# 60000 = 1 minute, 300000 = 5 minutes, 3600000 = 1 hour
scheduler.fixed-rate=3600000
# Enable or disable the job processing scheduler
scheduler.enabled=true

# Deadline Reminder Scheduler - Runs once a day to send deadline reminders
# Cron expression: "0 0 9 * * ?" = Every day at 9:00 AM
# Format: second minute hour day month weekday
# Examples:
#   "0 0 9 * * ?"   = 9:00 AM daily
#   "0 0 8 * * ?"   = 8:00 AM daily
#   "0 30 18 * * ?" = 6:30 PM daily
scheduler.deadline-reminder.cron=0 0 9 * * ?
# Enable or disable the deadline reminder scheduler
scheduler.deadline-reminder.enabled=true

# =================================================================
# NOTIFIER CONFIGURATION
# =================================================================
# Maximum number of notifiers a user can create
# Recommended: 3-10 depending on your use case
notifier.max-per-user=5

# =================================================================
# RATE LIMITING CONFIGURATION
# =================================================================
# Cooldown period (in minutes) between resume updates
# Prevents abuse of LaTeX compilation and Cloudinary storage
rate-limit.resume-update.cooldown-minutes=60

# Cooldown period (in minutes) between forgot password requests per email
# Prevents spam and abuse of password reset functionality
# Recommended: 2-5 minutes for security
rate-limit.forgot-password.cooldown-minutes=2

# =================================================================
# AI CONFIGURATION (Google Gemini)
# =================================================================
# Get your API key from: https://aistudio.google.com/app/apikey
gemini.api.key=your-gemini-api-key-here
# Model to use: gemini-1.5-flash (fast/cheap), gemini-1.5-pro (more powerful)
gemini.model=gemini-1.5-flash
# Minimum relevance score (0.0 to 1.0) for a job to be considered relevant
ai.relevance.threshold=0.7

# AI Prompt Template - customize to adjust matching behavior and data extraction
# Available placeholders: {job}, {role}, {skills}, {city}, {salary}, {companies}, {experience}, {noticePeriod}, {education}
# The AI will extract structured data from random job formats AND provide relevance scoring based on ALL user preferences
ai.prompt.template=Analyze the following job posting and user preferences. Extract structured information and score the relevance from 0 to 1.\n\nJob Posting (may be in any format - text, structured, or mixed):\n{job}\n\nUser Preferences:\nRole Looking For: {role}\nSkills: {skills}\nCity: {city}\nSalary: {salary}\nCompanies: {companies}\nExperience: {experience}\nNotice Period: {noticePeriod}\nEducation: {education}\n\nTasks:\n1. CAREFULLY extract ALL job information from the posting including role/position, company, batch/graduation year requirements, job type (Full-Time/Internship/etc), application deadline, duration if internship, and comprehensive description\n2. Analyze how well this job matches the user preferences (consider role match, skills alignment, location, salary, company preference, experience level, education background, and notice period)\n3. Provide a relevance score from 0 to 1 based on ALL user preferences\n4. Extract job application link if available\n\nIMPORTANT: You MUST provide ALL fields in the JSON response. If information is not found in the job posting, use these defaults:\n- For 'role': try to infer from job description or use "Not specified"\n- For 'batch': null if not mentioned\n- For 'jobType': infer from context (look for keywords like internship, full-time, contract) or use "Full-Time" as default\n- For 'deadline': must be in yyyy-MM-dd format (e.g., 2025-12-31). Convert any date mentioned to this format. Use null if not mentioned.\n- For 'duration': null if not internship or not mentioned\n\nProvide ONLY a valid JSON response (no markdown, no extra text) with these exact keys:\n{\n  "score": number between 0 and 1,\n  "reason": "explanation of the score",\n  "company": "company name",\n  "role": "job title/position",\n  "experience": "required experience",\n  "location": "job location/city",\n  "salary": "salary range or amount",\n  "batch": "graduation year if mentioned, otherwise null",\n  "jobType": "Full-Time or Internship or Part-Time or Contract",\n  "deadline": "deadline in yyyy-MM-dd format if mentioned, otherwise null",\n  "duration": "duration if internship, otherwise null",\n  "description": "comprehensive job description with all details",\n  "jobLink": "URL if found, otherwise null"\n}

# =================================================================
# CLOUDINARY CONFIGURATION (Cloud Storage)
# =================================================================
# Sign up for free at: https://cloudinary.com/users/register/free
cloudinary.cloud-name=your-cloud-name
cloudinary.api-key=your-api-key
cloudinary.api-secret=your-api-secret

# =================================================================
# LATEX COMPILER CONFIGURATION
# =================================================================
# Online LaTeX compiler service URL (using LaTeX.Online API by YtoTech)
# Note: The actual endpoint is hardcoded in LatexCompilerService
latex.compiler.url=https://latex.ytotech.com/builds/sync
# Compilation timeout in milliseconds
latex.timeout=30000

# =================================================================
# EMAIL CONFIGURATION (Gmail SMTP)
# =================================================================
# For Gmail, you need to:
# 1. Enable 2-factor authentication on your Gmail account
# 2. Generate an "App Password" from: https://myaccount.google.com/apppasswords
# 3. Use that app password (not your Gmail password) below
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-16-digit-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Frontend URL for password reset link (update this to your actual frontend URL)
app.frontend.url=http://localhost:5173

# =================================================================
# SERVER CONFIGURATION
# =================================================================
server.port=8080

# =================================================================
# LOGGING CONFIGURATION
# =================================================================
# Logging is primarily configured in logback-spring.xml
# You can override log levels here if needed:
# logging.level.com.jobnotifer=DEBUG
# logging.level.org.springframework=INFO
# logging.level.org.hibernate.SQL=DEBUG

# Log file path (logs will be written to this directory)
logging.file.path=logs

# Single log file with rotation (configured in logback-spring.xml):
# - application.log: All logs in one file (50MB/file, 30 days, 3GB total)
# - Rotates daily or when reaching 50MB
# - Compressed archives stored in logs/archive/

# =================================================================
