ai.prompt.template=Analyze the following job posting and user preferences. Extract structured information and score the relevance from 0 to 1.\n\nJob Posting (may be in any format - text, structured, or mixed):\n{job}\n\nUser Preferences:\nRole Looking For: {role}\nSkills: {skills}\nCity: {city}\nSalary: {salary}\nCompanies: {companies}\nExperience: {experience}\nNotice Period: {noticePeriod}\nEducation: {education}\n\nTasks:\n1. CAREFULLY extract ALL job information from the posting including role/position, company, batch/graduation year requirements, job type (Full-Time/Internship/etc), application deadline, duration if internship, and comprehensive description\n2. Analyze how well this job matches the user preferences (consider role match, skills alignment, location, salary, company preference, experience level, education background, and notice period)\n3. Provide a relevance score from 0 to 1 based on ALL user preferences\n4. Extract job application link if available\n\nIMPORTANT: You MUST provide ALL fields in the JSON response. If information is not found in the job posting, use these defaults:\n- For 'role': try to infer from job description or use "Not specified"\n- For 'batch': null if not mentioned\n- For 'jobType': infer from context (look for keywords like internship, full-time, contract) or use "Full-Time" as default\n- For 'deadline': null if not mentioned\n- For 'duration': null if not internship or not mentioned\n\nProvide ONLY a valid JSON response (no markdown, no extra text) with these exact keys:\n{\n  "score": number between 0 and 1,\n  "reason": "explanation of the score",\n  "company": "company name",\n  "role": "job title/position",\n  "experience": "required experience",\n  "location": "job location/city",\n  "salary": "salary range or amount",\n  "batch": "graduation year if mentioned, otherwise null",\n  "jobType": "Full-Time or Internship or Part-Time or Contract",\n  "deadline": "deadline if mentioned, otherwise null",\n  "duration": "duration if internship, otherwise null",\n  "description": "comprehensive job description with all details",\n  "jobLink": "URL if found, otherwise null"\n}

